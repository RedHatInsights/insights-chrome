---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: chrome-platform-infra-tests
spec:
  description: |
    Platform infrastructure tests for insights-chrome.
    Runs Playwright-based redirect, route reachability, and stage WebSocket tests
    against console.redhat.com environments on a daily schedule.
  params:
    - name: SNAPSHOT
      description: "The Konflux snapshot being tested"
      type: string
  results:
    - name: TEST_OUTPUT
      description: "Test result summary"
      value: $(tasks.run-platform-infra-tests.results.TEST_OUTPUT)
  tasks:
    - name: run-platform-infra-tests
      taskSpec:
        results:
          - name: TEST_OUTPUT
            description: "Test output in Konflux standardized format"
        steps:
          - name: run-tests
            # Playwright v1.62.1-jammy; keep in sync with @playwright/test in package-lock.json.
            image: mcr.microsoft.com/playwright@sha256:b3251f7ff1a9fa559a28d1c67eaa15fc1a9800f7845e82756caea7842967f615
            securityContext:
              # UID and GID of pwuser in the Playwright Jammy image.
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            env:
              - name: PLATFORM_INFRA_ENV
                value: stage
              - name: CI
                value: "true"
              - name: E2E_USER
                valueFrom:
                  secretKeyRef:
                    name: chrome-credentials-secret
                    key: username
              - name: E2E_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: chrome-credentials-secret
                    key: password
            script: |
              #!/bin/bash
              set -euo pipefail

              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              echo "========================================="
              echo "Platform infrastructure tests"
              echo "Environment: ${PLATFORM_INFRA_ENV}"
              echo "Timestamp: ${TIMESTAMP}"
              echo "========================================="

              WORKDIR=$(mktemp -d)
              # Keep npm and other caches writable for the CI-assigned user.
              export HOME="${WORKDIR}"
              cd "${WORKDIR}"

              echo "Cloning insights-chrome..."
              git clone --depth 1 https://github.com/RedHatInsights/insights-chrome.git .

              echo "Installing dependencies..."
              npm ci

              echo "Running platform infrastructure tests..."
              set +e
              npx playwright test playwright/e2e/platform-infra/ \
                --reporter=line 2>&1 | tee test-output.txt
              TEST_EXIT=${PIPESTATUS[0]}
              set -e

              # Playwright line reporter prints a summary like:
              #   X passed (Ys)
              #   X failed (Ys)
              SUCCESSES=$(grep -oP '^\s*\K\d+(?= passed)' test-output.txt || echo 0)
              FAILURES=$(grep -oP '^\s*\K\d+(?= failed)' test-output.txt || echo 0)

              if [ "${TEST_EXIT}" -eq 0 ]; then
                RESULT="SUCCESS"
                NOTE="All platform infrastructure tests passed"
              else
                RESULT="FAILURE"
                NOTE="${FAILURES} test(s) failed"
              fi

              echo ""
              echo "========================================="
              echo "Result: ${RESULT}"
              echo "Passed: ${SUCCESSES}, Failed: ${FAILURES}"
              echo "========================================="

              cat > $(results.TEST_OUTPUT.path) <<RESULT
              {"result":"${RESULT}","timestamp":"${TIMESTAMP}","successes":${SUCCESSES},"failures":${FAILURES},"warnings":0,"note":"${NOTE}"}
              RESULT

              exit "${TEST_EXIT}"
  finally:
    - name: notify-slack
      params:
        # Status is available even if setup fails before TEST_OUTPUT is written.
        - name: test-status
          value: $(tasks.run-platform-infra-tests.status)
        - name: results-url
          value: https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/$(context.pipelineRun.namespace)/applications/chrome-frontend-sc/pipelineruns/$(context.pipelineRun.name)/logs
      taskSpec:
        params:
          - name: test-status
            type: string
          - name: results-url
            type: string
        steps:
          - name: notify
            # Reuse the test image, which includes curl.
            image: mcr.microsoft.com/playwright@sha256:b3251f7ff1a9fa559a28d1c67eaa15fc1a9800f7845e82756caea7842967f615
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            env:
              - name: SLACK_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: platform-infra-slack-webhook
                    key: url
                    optional: true
              - name: TEST_STATUS
                value: $(params.test-status)
              - name: RESULTS_URL
                value: $(params.results-url)
            script: |
              #!/bin/bash
              set -euo pipefail

              if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
                echo "Slack notification skipped: webhook is not configured."
                exit 0
              fi

              # Only a successful test task is a pass, including setup in the outcome.
              case "$TEST_STATUS" in
                Succeeded) NOTIFICATION_STATUS=pass ;;
                *) NOTIFICATION_STATUS=fail ;;
              esac

              # The URL uses the fixed console address and Kubernetes resource names.
              PAYLOAD=$(printf '{"status":"%s","results_url":"%s"}' "$NOTIFICATION_STATUS" "$RESULTS_URL")

              # Suppress response bodies and transport errors to keep the URL out of logs.
              # Do not retry POSTs: the workflow may already have accepted the message.
              if ! HTTP_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 30 \
                --header 'Content-Type: application/json' \
                --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"); then
                echo "Slack notification delivery failed."
                exit 0
              fi

              case "$HTTP_STATUS" in
                2??) echo "Slack workflow accepted the notification." ;;
                *) echo "Slack notification rejected (HTTP ${HTTP_STATUS})." ;;
              esac
