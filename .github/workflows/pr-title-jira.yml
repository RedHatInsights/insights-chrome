name: Validate Jira PR reference

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  jira-reference:
    name: Validate Jira title and description
    runs-on: ubuntu-slim
    steps:
      - name: Checkout trusted validation script
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/validate-jira-pr-reference.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/validate-jira-pr-reference.sh
