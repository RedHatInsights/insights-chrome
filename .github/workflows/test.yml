name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # prerequisite for all jobs, install node modules only once
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # npm ci always reinstalls node_modules from scratch, so only cache the Cypress binary download
      - uses: actions/cache@v5
        id: cypress-cache
        with:
          path: |
            /home/runner/.cache/Cypress
            .cypress-cache
          key: install-cache-${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
  # unit testing job
  test-unit:
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --coverage
      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage/clover.xml
  # lint
  lint:
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
  # cypress component testing
  cypress-component:
    runs-on: ubuntu-latest
    needs: [install]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # npm ci always reinstalls node_modules from scratch, so only cache the Cypress binary download
      - uses: actions/cache@v5
        id: cypress-cache
        with:
          path: |
            /home/runner/.cache/Cypress
            .cypress-cache
          key: install-cache-${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - uses: cypress-io/github-action@v6
        with:
          component: true
          install: false
          browser: chrome
  # build job
  build:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
